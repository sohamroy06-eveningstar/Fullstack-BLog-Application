<head>

    >

    <!-- BASE URL -->

    <base href="/https://fullstack-blog-application.onrender.com/">


    <!-- ========================================
         PRIMARY SEO
    ========================================= -->

    <title>
        Roy Blog | admin
    </title>

    <meta
        name="title"
        content="Roy Blog | Fullstack Developer & Tech Blog"
    >

    <meta
        name="description"
        content="Roy Blog is a modern fullstack web development blog by Soham Roy covering JavaScript, Node.js, Express.js, frontend development, backend systems, UI/UX design, SEO, and modern web technologies."
    >

    <meta
        name="keywords"
        content="Fullstack Developer, Web Developer, Node.js Blog, JavaScript Blog, Express.js, Frontend Developer, Backend Developer, SEO, UI UX Design, Web Development, Programming Blog, Tech Blog"
    >

    >

    <meta

        content="index, follow"
    >

    >


    <!-- ========================================
         OPEN GRAPH SEO
    ========================================= -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="https://fullstack-blog-application.onrender.com/"
    >

    <meta

        content="Roy Blog | Fullstack Developer & Tech Blog"
    >

    <meta
        property="og:description"
        content="Modern fullstack development blog covering Node.js, JavaScript, SEO, UI/UX, frontend and backend development."
    >

    <meta

         TWITTER / X SEO
    ========================================= -->

    >

    >

    <meta

    >

    <meta
        name="twitter:image"
        content="https://fullstack-blog-application.onrender.com/favicon.png"

         FAVICON
    ========================================= -->

         THEME COLOR
    ========================================= -->

        content="#ffc72c"
    >


    <!-- ========================================
         CANONICAL URL
    ========================================= -->

    <link

        href="https://fullstack-blog-application.onrender.com/"
    >
    <!-- CSS -->

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <div class="admin-panel">

        <!-- HEADING -->

        <h1>Admin Panel</h1>



        <!-- ADD POST BUTTON -->

        <a
            href="/add"
            class="add-post-link"
        >
            Add New Post
        </a>



        <!-- POSTS TABLE -->

        <table id="post-table">

            <thead>

                <tr>

                    <th>Image</th>

                    <th>Title</th>

                    <th>Category</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>
                <!-- POSTS LOAD HERE -->
            </tbody>

        </table>



        <!-- BACK BUTTON -->

        <a
            href="/"
            class="admin-back-link"
        >
            Back To Home
        </a>

    </div>



    <!-- JAVASCRIPT -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                fetch("/posts")

                    .then((response) =>
                        response.json()
                    )

                    .then((posts) => {

                        const postTable =
                            document.getElementById(
                                "post-table"
                            );

                        const postsTableBody =
                            document.querySelector(
                                "#post-table tbody"
                            );



                        // =========================
                        // EMPTY STATE
                        // =========================

                        if(posts.length === 0){

                            postTable.style.display = "none";

                            const emptyMessage =
                                document.createElement("div");

                            emptyMessage.classList.add(
                                "empty-posts"
                            );

                            emptyMessage.innerHTML = `

                                <h2>
                                    No Posts Found
                                </h2>

                                <p>
                                    Start by creating your first blog post.
                                </p>

                            `;

                            document
                                .querySelector(
                                    ".admin-panel"
                                )

                                .insertBefore(

                                    emptyMessage,

                                    document.querySelector(
                                        ".admin-back-link"
                                    )

                                );

                            return;
                        }



                        // =========================
                        // SHOW POSTS
                        // =========================

                        postsTableBody.innerHTML =
                            posts.map((post) => `

                                <tr>

                                    <td>

                                        ${
                                            post.image

                                            ? `

                                                <img
                                                    src="${post.image}"
                                                    alt="${post.title}"
                                                >

                                              `

                                            : "No Image"
                                        }

                                    </td>

                                    <td>
                                        ${post.title}
                                    </td>

                                    <td>

                                        <span>

                                            ${
                                                post.category
                                                || "No Category"
                                            }

                                        </span>

                                    </td>

                                    <td>

                                        <button

                                            class="delete-button"

                                            data-id="${post.id}"

                                        >

                                            Delete

                                        </button>

                                    </td>

                                </tr>

                            `).join("");



                        // =========================
                        // DELETE POST
                        // =========================

                        const deleteButtons =

                            document.querySelectorAll(
                                ".delete-button"
                            );



                        deleteButtons.forEach((button) => {

                            button.addEventListener(
                                "click",

                                function () {

                                    const postId =
                                        this.dataset.id;



                                    const confirmDelete =
                                        confirm(

                                            "Are you sure you want to delete this post?"

                                        );



                                    if(!confirmDelete) return;



                                    fetch(

                                        `/delete/${postId}`,

                                        {
                                            method: "DELETE"
                                        }

                                    )

                                    .then((response) =>
                                        response.json()
                                    )

                                    .then((data) => {

                                        alert(
                                            data.message
                                        );



                                        // REMOVE ROW

                                        this.closest("tr")
                                            .remove();



                                        // CHECK EMPTY AGAIN

                                        const remainingRows =

                                            document.querySelectorAll(

                                                "#post-table tbody tr"

                                            );



                                        if(
                                            remainingRows.length === 0
                                        ){

                                            postTable.style.display =
                                                "none";



                                            const emptyMessage =

                                                document.createElement(
                                                    "div"
                                                );



                                            emptyMessage.classList.add(
                                                "empty-posts"
                                            );



                                            emptyMessage.innerHTML = `

                                                <h2>
                                                    No Posts Found
                                                </h2>

                                                <p>
                                                    Start by creating your first blog post.
                                                </p>

                                            `;



                                            document

                                                .querySelector(
                                                    ".admin-panel"
                                                )

                                                .insertBefore(

                                                    emptyMessage,

                                                    document.querySelector(
                                                        ".admin-back-link"
                                                    )

                                                );
                                        }

                                    })

                                    .catch((error) => {

                                        console.log(

                                            "Delete Error:",

                                            error

                                        );

                                    });

                                }

                            );

                        });

                    })

                    .catch((error) => {

                        console.log(

                            "Fetch Error:",

                            error

                        );

                    });

            }

        );

    </script>

</body>

</html>
