<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="admin-panel">

        <h1>Admin Panel</h1>

        <a href="/add" class="add-post-link">
            Add New Post
        </a>

        <table id="post-table">

            <thead>
                <tr>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <!-- Posts will load dynamically -->
            </tbody>

        </table>

        <a href="/" class="admin-back-link">
            Back To Home
        </a>

    </div>

    <!-- JavaScript -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            fetch("/posts")

                .then((response) => response.json())

                .then((posts) => {

                    const postsTableBody =
                        document.querySelector("#post-table tbody");



                    // SHOW POSTS

                    postsTableBody.innerHTML = posts.map((post) => `

                        <tr>

                            <td>
                                ${
                                    post.image
                                    ? `<img src="${post.image}" alt="${post.title}">`
                                    : "No Image"
                                }
                            </td>

                            <td>${post.title}</td>

                            <td>${post.category || "No Category"}</td>

                            <td>
                                <button 
                                    class="delete-button"
                                    data-id="${post.id}"
                                >
                                    Delete
                                </button>
                            </td>

                        </tr>

                    `).join("");



                    // DELETE POST

                    const deleteButtons =
                        document.querySelectorAll(".delete-button");

                    deleteButtons.forEach((button) => {

                        button.addEventListener("click", function () {

                            const postId = this.dataset.id;

                            const confirmDelete =
                                confirm("Are you sure you want to delete this post?");

                            if (!confirmDelete) return;



                            fetch(`/delete/${postId}`, {
                                method: "DELETE"
                            })

                            .then((response) => response.json())

                            .then((data) => {

                                alert(data.message);

                                location.reload();

                            })

                            .catch((error) => {

                                console.log("Delete Error:", error);

                            });

                        });

                    });

                })

                .catch((error) => {

                    console.log("Fetch Error:", error);
                    // delete post event lister

                    document.querySelector(".delete-button").forEach((button)=>{
                        button.addEventListener("click",function(){
                            const postId = this.getAttribute("dataid")
                            fetch(`/delete/${postId}`,{
                                method:"POST"

                            })
                            .then((Response)=>{
                                if(!Response.ok){
                                    throw new Error("Network Response was not ok");
                                }
                                // remove the row from table
                                this.closest("tr").remove();
                            })
                            .catch((error)=>{
                                console.error(
                                    "there was a problem with the fetch operation",
                                    error
                                )
                            })
                        })
                    })

                });

        });

    </script>

</body>

</html>
