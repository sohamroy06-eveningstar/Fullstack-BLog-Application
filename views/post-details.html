    <!-- ===== Main JS ===== -->

    <!-- ===== Post Details Script ===== -->
    <script>

        document.addEventListener('DOMContentLoaded', function () {

            // =====================================
            // Get title from URL
            // Example:
            // /post/My-Blog-Post
            // =====================================

            const postTitle = decodeURIComponent(
                window.location.pathname.split("/").pop()
            )
            .replace(/-/g, " ")
            .trim();

            // =====================================
            // Fetch Post Data
            // =====================================

            fetch(`/post/${encodeURIComponent(postTitle)}`)

                .then((response) => {

                    if (!response.ok) {
                        throw new Error(`HTTP Error: ${response.status}`);
                    }

                    return response.json();

                })

                .then((post) => {

                    console.log(post);

                    // =====================================
                    // Set Post Title
                    // =====================================

                    document.getElementById('post-title').innerText =
                        post.title || "No Title";


                    // =====================================
                    // Set Category
                    // =====================================

                    document.getElementById('post-catagory').innerText =
                        post.category || "General";


                    // =====================================
                    // Set Image
                    // =====================================

                    if (post.image) {

                        document.getElementById('post-image').innerHTML = `
                        
                            <img 
                                src="${post.image}" 
                                alt="${post.title}"
                                class="header-img"
                            >

                        `;

                    }


                    // =====================================
                    // Set Content
                    // =====================================

                    document.getElementById('post-content').innerHTML =
                        post.content || "<p>No content available</p>";

                })

                .catch((error) => {

                    console.error("Error fetching post:", error);

                    document.getElementById('post-content').innerHTML = `
                    
                        <h2>Post Not Found</h2>
                        <p>Unable to load blog post.</p>
                    
                    `;

                });

        });

    </script>
