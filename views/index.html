<body>

    <!-- ========================================
         HEADER
    ========================================= -->

    <header>

        <div class="nav container">

            <!-- LOGO -->

            <a href="/" class="logo">
                R <span>O</span>Y
            </a>


            <!-- NAV RIGHT -->

            <div class="nav-right">

                <a
                    href="/admin"
                    class="admin-btn"
                >
                    <i class='bx bx-user'></i>
                </a>

                <a
                    href="/add"
                    class="write-btn"
                >
                    <i class='bx bx-pencil'></i>
                    Write
                </a>

            </div>

        </div>

    </header>



    <!-- ========================================
         HERO SECTION
    ========================================= -->

    <section class="home" id="home">

        <div class="home-content">

            <h2>
                The Roy Blog
            </h2>


            <!-- SEARCH -->

            <div class="search-box">

                <i class='bx bx-search'></i>

                <input
                    type="search"
                    placeholder="Search"
                >

            </div>

        </div>

    </section>



    <!-- ========================================
         FILTERS
    ========================================= -->

    <div class="post-filter container">

        <span
            class="filter-item active-filter"
            data-filter="all"
        >
            All
        </span>

        <span
            class="filter-item"
            data-filter="art"
        >
            Art
        </span>

        <span
            class="filter-item"
            data-filter="technology"
        >
            Technology
        </span>

        <span
            class="filter-item"
            data-filter="food"
        >
            Food
        </span>

    </div>



    <!-- ========================================
         POSTS
    ========================================= -->

    <section
        class="posts container"
        id="posts"
    >
        <!-- POSTS LOAD HERE -->
    </section>



    <!-- ========================================
         FOOTER
    ========================================= -->

    <div class="footer-container">

        <p>
            &#169; Roy 2026
        </p>


        <div class="social">

            <a
                href="#"
                aria-label="Facebook"
            >
                <i class="fa-brands fa-facebook"></i>
            </a>

            <a
                href="#"
                aria-label="X / Twitter"
            >
                <i class='fa-brands fa-x-twitter'></i>
            </a>

            <a
                href="#"
                aria-label="Instagram"
            >
                <i class='bx bxl-instagram'></i>
            </a>

            <a
                href="#"
                aria-label="LinkedIn"
            >
                <i class='bx bxl-linkedin'></i>
            </a>

        </div>

    </div>



    <!-- ========================================
         JQUERY
    ========================================= -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>



    <!-- ========================================
         MAIN JS
    ========================================= -->

    <script src="/js/main.js"></script>



    <!-- ========================================
         FILTER JS
    ========================================= -->

    <script>

        $(document).ready(function () {

            // FILTER POSTS

            $(".filter-item").click(function () {

                const value =
                    $(this).attr("data-filter");



                if (value == "all") {

                    $(".post").show(1000);

                } else {

                    $(".post")
                        .not("." + value)
                        .hide(1000);

                    $(".post")
                        .filter("." + value)
                        .show(1000);

                }

            });



            // ACTIVE FILTER BUTTON

            $(".filter-item").click(function () {

                $(this)

                    .addClass("active-filter")

                    .siblings()

                    .removeClass("active-filter");

            });

        });

    </script>

</body>

</html>
